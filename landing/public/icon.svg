<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    LeadBells mark - a bell mid-ring whose interior is a funnel of converging
    signal arcs, with the clapper replaced by a spark: scattered traffic
    narrowing into one qualified lead that rings in one place. Keep in sync with
    src/components/brand/logo.tsx (identical geometry at 1/8 scale).
  -->
  <defs>
    <linearGradient id="leadaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="leadaiRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="leadaiSheen" cx="28%" cy="16%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="leadaiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- The bell, with the funnel arcs punched out of it -->
    <mask id="leadaiBell">
      <path
        d="M112 344 C144 304, 156 264, 156 216 C156 156, 200 112, 256 112 C312 112, 356 156, 356 216 C356 264, 368 304, 400 344 Z"
        fill="#FFFFFF"
      />
      <rect x="100" y="344" width="312" height="28" rx="14" fill="#FFFFFF" />
      <circle cx="256" cy="88" r="24" fill="#FFFFFF" />
      <g fill="none" stroke="#000000" stroke-width="22" stroke-linecap="round">
        <path d="M176 202 Q256 252 336 202" />
        <path d="M204 266 Q256 300 308 266" />
      </g>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#leadaiBg)" />
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#leadaiSheen)" />
  <rect x="16" y="16" width="480" height="480" rx="140" fill="none" stroke="url(#leadaiRim)" stroke-width="10" />

  <!-- Ring waves -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" opacity="0.5">
    <path d="M76 250 C60 222, 62 178, 84 150" />
    <path d="M436 250 C452 222, 450 178, 428 150" />
  </g>

  <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" mask="url(#leadaiBell)" />

  <!-- Clapper: the qualified lead -->
  <path
    d="M256 380 C256 402, 264 410, 284 418 C264 426, 256 434, 256 456 C256 434, 248 426, 228 418 C248 410, 256 402, 256 380 Z"
    fill="#FFFFFF"
    filter="url(#leadaiGlow)"
  />
</svg>
