<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Gradient -->
    <linearGradient id="leadAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Inner Glow / Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Star Fill Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Rounded Edges -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#leadAiGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="none" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Main AI Sparkle Star (Prominent, Bold & Crisp) -->
  <path
    d="M 256 68
       C 256 168, 324 236, 424 256
       C 324 276, 256 344, 256 444
       C 256 344, 188 276, 88 256
       C 188 236, 256 168, 256 68 Z"
    fill="url(#starGrad)"
    filter="url(#shadow)"
  />

  <!-- Secondary Companion Sparkle (Top-Right Accent) -->
  <path
    d="M 384 84
       C 384 116, 404 136, 436 144
       C 404 152, 384 172, 384 204
       C 384 172, 364 152, 332 144
       C 364 136, 384 116, 384 84 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <!-- Subtle Core Star Glow Point -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" opacity="0.6" filter="blur(4px)" />
</svg>
